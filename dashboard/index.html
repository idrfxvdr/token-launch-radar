<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Launch Radar</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="dot" aria-hidden="true"></span>
    <div>
      <h1>Token Launch Radar</h1>
      <p class="sub" id="asof">Pre-token protocols, sorted by implied value</p>
    </div>
  </div>
  <nav class="tabs" aria-label="Sections">
    <a href="#view=board" data-view="board">Board</a>
    <a href="#view=live" data-view="live">Already trading</a>
    <a href="#view=excluded" data-view="excluded">Excluded</a>
    <a href="#view=method" data-view="method">Method</a>
  </nav>
  <button class="theme" id="theme" type="button" aria-label="Switch light or dark theme">◐</button>
</header>
<main id="app" aria-live="polite">
</main>
<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <article class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="d-title" tabindex="-1"></article>
</div>
<footer class="foot">Estimates, not financial advice. No token recorded does not mean none exists.</footer>
<script src="../data.js"></script>
<script src="00-model.js"></script>
<script src="checks.js"></script>
<script src="app.js"></script>
</body>
</html>
